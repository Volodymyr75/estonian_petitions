name: Daily MotherDuck Sync

on:
  schedule:
    - cron: '0 7 * * *' # Run at 07:00 UTC daily
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run ETL Sync Script
      id: sync_script
      env:
        MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        DB_PATH: md:estonia_petitions
      run: |
        python etl/daily_sync.py

    - name: Generate Static API JSONs
      env:
        MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        DB_PATH: md:estonia_petitions
      run: |
        python generate_api_json.py

    - name: Commit and Push API Data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add public/api_data/
        git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update daily static api data" && git push)

    - name: Send Telegram Notification (Success - Green)
      if: success() && env.TELEGRAM_TOKEN != '' && (env.SYNC_STATUS == 'success' || env.SYNC_STATUS == '')
      uses: appleboy/telegram-action@master
      with:
        to: ${{ env.TELEGRAM_TO }}
        token: ${{ env.TELEGRAM_TOKEN }}
        message: |
          🟢 *Estonian Civic Analytics*
          Daily MotherDuck Sync completed successfully\!

    - name: Send Telegram Notification (Partial Success - Yellow)
      if: success() && env.TELEGRAM_TOKEN != '' && env.SYNC_STATUS == 'partial'
      uses: appleboy/telegram-action@master
      with:
        to: ${{ env.TELEGRAM_TO }}
        token: ${{ env.TELEGRAM_TOKEN }}
        message: |
          🟡 *Estonian Civic Analytics*
          Daily MotherDuck Sync completed with warnings\!
          Rahvaalgatus sync succeeded, but Riigikogu (Parliament) sync timed out or failed\.

    - name: Send Telegram Notification (Failure)
      if: failure() && env.TELEGRAM_TOKEN != ''
      uses: appleboy/telegram-action@master
      with:
        to: ${{ env.TELEGRAM_TO }}
        token: ${{ env.TELEGRAM_TOKEN }}
        message: |
          🔴 *Estonian Civic Analytics*
          ERROR: Daily MotherDuck Sync FAILED\!
          Review logs here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
